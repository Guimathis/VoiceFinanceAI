spring:
  application:
    name: voicefinance
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/voicefinance_test}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  ai:
    google:
      genai:
        api-key: ${GOOGLE_GENAI_APIKEY}
        chat:
          model: gemini-3.1-flash-lite

voicefinance:
  ai:
    transcription-model: gemini-3.5-transcription
    agent-model: gemini-3.1-flash-lite

logging:
  level:
    root: info
    com.voicefinance.advisors: debug
    org.springframework.ai.chat.client.advisor: debug
server:
  port: ${SERVER_PORT:8000}
